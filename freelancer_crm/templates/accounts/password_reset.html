{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Забыли пароль?</h2>
    <p>Введите свой email, и мы отправим вам ссылку для восстановления пароля.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
    <p class="mt-3"><a href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Назад ко входу</a></p>
</div>
{% endblock %}
