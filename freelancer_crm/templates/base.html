<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freelancer CRM</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Animate.css для анимаций -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- ✅ jQuery (обязательно первым!) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- ✅ SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        .dark-mode .card, .dark-mode .list-group-item {
            background-color: #1f1f1f;
            color: #e0e0e0;
        }
        .dark-mode .navbar {
            background-color: #1a1a1a !important;
        }
        .dark-mode .form-control {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Freelancer CRM</a>
            <div class="ms-auto d-flex align-items-center">
                <button id="themeToggle" class="btn btn-sm btn-outline-light me-2">
                    {% if request.COOKIES.theme == 'dark' %}Светлая{% else %}Темная{% endif %} тема
                </button>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        {{ user.username }}
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{% url 'accounts:logout' %}">Выйти</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <!-- Вход -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Вход</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Логин</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </form>
                    <p class="mt-2">
                        <a href="#" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#passwordResetModal">
                            Забыли пароль?
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Сброс пароля -->
    <div class="modal fade" id="passwordResetModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Восстановление пароля</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="{% url 'password_reset' %}" method="post">
                        {% csrf_token %}
                        <p>Введите email, указанный при регистрации.</p>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить ссылку</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ Bootstrap Bundle (после jQuery) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ Основной скрипт -->
    <script>
        $(document).ready(function() {
            // Проверка, загрузился ли jQuery
            if (typeof $ === 'undefined') {
                alert('Ошибка: jQuery не загружен!');
                return;
            }

            // Обработчик формы входа
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                $.ajax({
                    type: 'POST',
                    url: '{% url "accounts:login" %}',
                     $(this).serialize(),
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            // ✅ ПЕРЕНАПРАВЛЕНИЕ НА ГЛАВНУЮ
                            window.location.href = response.redirect_url;
                        } else {
                            Swal.fire('Ошибка', response.error, 'error');
                        }
                    },
                    error: function(xhr) {
                        Swal.fire('Ошибка', 'Не удалось подключиться к серверу', 'error');
                        console.error('AJAX Error:', xhr);
                    }
                });
            });

            // Темная тема
            document.getElementById('themeToggle').addEventListener('click', () => {
                const isDark = document.body.classList.toggle('dark-mode');
                document.cookie = `theme=${isDark ? 'dark' : 'light'};path=/;max-age=31536000`;
                document.getElementById('themeToggle').textContent = isDark ? 'Светлая тема' : 'Темная тема';
            });
        });
    </script>
</body>
</html>
