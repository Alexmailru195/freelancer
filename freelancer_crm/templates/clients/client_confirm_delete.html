{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card text-center">
        <div class="card-body">
            <h3>Вы уверены, что хотите удалить клиента?</h3>
            <p><strong>{{ client.name }}</strong> ({{ client.email }})</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'clients:client_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
